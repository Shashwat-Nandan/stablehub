<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - StableHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/admin/dashboard.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div class="admin-header-content">
                <h1>Admin Dashboard</h1>
                <div class="admin-actions">
                    <span id="adminUsername" class="admin-username"></span>
                    <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <div class="admin-sidebar">
                <nav class="admin-nav">
                    <a href="#" class="nav-item active" data-view="posts">Blog Posts</a>
                    <a href="#" class="nav-item" data-view="new-post">New Post</a>
                    <a href="#" class="nav-item" data-view="newsletter">Newsletter</a>
                    <a href="#" class="nav-item" data-view="subscribers">Subscribers</a>
                </nav>
            </div>

            <div class="admin-content">
                <!-- Posts List View -->
                <div id="postsView" class="view active">
                    <div class="view-header">
                        <h2>Blog Posts</h2>
                        <button class="btn btn-primary" id="newPostBtn">Create New Post</button>
                    </div>

                    <div class="posts-filter">
                        <button class="filter-btn active" data-status="all">All</button>
                        <button class="filter-btn" data-status="published">Published</button>
                        <button class="filter-btn" data-status="draft">Drafts</button>
                    </div>

                    <div id="postsContainer" class="posts-container">
                        <p class="loading">Loading posts...</p>
                    </div>
                </div>

                <!-- New/Edit Post View -->
                <div id="editorView" class="view">
                    <div class="view-header">
                        <h2 id="editorTitle">New Blog Post</h2>
                        <button class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                    </div>

                    <form id="postForm" class="post-form">
                        <input type="hidden" id="postId">

                        <div class="form-group">
                            <label for="postTitle">Title *</label>
                            <input type="text" id="postTitle" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="postCategory">Category *</label>
                                <select id="postCategory" required>
                                    <option value="">Select category</option>
                                    <option value="Layer-1">Layer-1</option>
                                    <option value="Layer-2">Layer-2</option>
                                    <option value="Emerging Tech">Emerging Tech</option>
                                    <option value="Stablecoins">Stablecoins</option>
                                    <option value="DeFi">DeFi</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="postDate">Display Date</label>
                                <input type="text" id="postDate" placeholder="e.g., October 2025">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="postContent">Content *</label>
                            <textarea id="postContent" rows="15" required></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" data-status="draft">Save as Draft</button>
                            <button type="submit" class="btn btn-success" data-status="published">Publish</button>
                        </div>
                    </form>
                </div>

                <!-- Newsletter View -->
                <div id="newsletterView" class="view">
                    <div class="view-header">
                        <h2>Send Newsletter</h2>
                        <button class="btn btn-secondary" id="viewHistoryBtn">View History</button>
                    </div>

                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="stat-label">Active Subscribers</div>
                            <div class="stat-value" id="subscriberCount">-</div>
                        </div>
                    </div>

                    <form id="newsletterForm" class="post-form">
                        <div class="form-group">
                            <label for="newsletterSubject">Subject *</label>
                            <input type="text" id="newsletterSubject" required>
                        </div>

                        <div class="form-group">
                            <label for="newsletterContent">Content (HTML supported) *</label>
                            <textarea id="newsletterContent" rows="15" required placeholder="Enter your newsletter content. HTML tags are supported for formatting."></textarea>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="testModeCheck">
                                Test Mode (send to test email only)
                            </label>
                        </div>

                        <div class="form-group" id="testEmailGroup" style="display: none;">
                            <label for="testEmail">Test Email Address</label>
                            <input type="email" id="testEmail" placeholder="test@example.com">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-success" id="sendNewsletterBtn">Send Newsletter</button>
                            <button type="button" class="btn btn-secondary" id="previewNewsletterBtn">Preview</button>
                        </div>
                    </form>
                </div>

                <!-- Subscribers View -->
                <div id="subscribersView" class="view">
                    <div class="view-header">
                        <h2>Newsletter Subscribers</h2>
                        <button class="btn btn-primary" id="addSubscriberBtn">Add Subscriber</button>
                    </div>

                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="stat-label">Total Subscribers</div>
                            <div class="stat-value" id="totalSubscribers">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Active Subscribers</div>
                            <div class="stat-value" id="activeSubscribers">-</div>
                        </div>
                    </div>

                    <div id="subscribersContainer" class="subscribers-container">
                        <p class="loading">Loading subscribers...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Preview -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Newsletter Preview</h3>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-body" id="previewContent"></div>
        </div>
    </div>

    <script src="/admin/dashboard.js"></script>
</body>
</html>
